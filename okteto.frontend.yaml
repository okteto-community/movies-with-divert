icon: https://apps.okteto.com/movies/icon.png

build:
  frontend:
    context: frontend
  tests:
    context: tests

deploy:
  divert:
    namespace: ${OKTETO_SHARED_NAMESPACE}
  commands:
  - name: Deploy Frontend
    command: helm upgrade --install frontend frontend/chart --set image=${OKTETO_BUILD_FRONTEND_IMAGE} --take-ownership

dev:
  frontend:
    image: okteto/node:20
    workdir: /usr/src/app
    command: bash
    sync:
      - frontend:/usr/src/app

test:
  e2e:
    image: ${OKTETO_BUILD_TESTS_IMAGE}
    context: tests
    caches:
      - yarn/.cache
      - node_modules
    commands:
      - yarn install
      - yarn test
    artifacts:
      - test-results
      - playwright-report