icon: https://apps.okteto.com/movies/icon.png

build:
  catalog:
    context: catalog
  tests:
    context: tests

deploy:
  divert:
    namespace: ${OKTETO_SHARED_NAMESPACE}
  commands:
  - name: Deploy Catalog
    command: helm upgrade --install catalog catalog/chart --set image=${OKTETO_BUILD_CATALOG_IMAGE}

dev:
  catalog:
    command: yarn start
    workdir: /src
    sync:
      - catalog:/src
    forward:
      - 9229:9229

test:
  e2e:
    image: ${OKTETO_BUILD_TESTS_IMAGE}
    context: tests
    caches:
      - yarn/.cache
      - node_modules
    commands:
      - yarn install
      - yarn test
    artifacts:
      - test-results
      - playwright-report